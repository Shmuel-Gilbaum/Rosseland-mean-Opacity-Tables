name: Publish to PyPI

# Create a GitHub release to publish. Nothing runs on an ordinary push.
#
#   1. bump the version in pyproject.toml AND rm_tables/__init__.py
#   2. tag and push:  git tag v0.1.0 && git push origin v0.1.0
#   3. draft a release on that tag and publish it
#
# The build job gates the upload: tests, both version checks and the wheel
# contents all run before anything reaches the index. One interpreter runs
# them, 3.12, against a floor of 3.10 declared in pyproject.toml.

on:
  release:
    types: [published]
  workflow_dispatch:          # lets you rehearse the build without releasing

permissions:
  contents: read              # least privilege; the publish job adds what it needs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Unit tests, every docstring example, and the README and usage
        # `testpaths` covers tests/ and rm_tables/, so tests/test_examples.py,
        # which runs the README and usage-guide code blocks, is already in here.
        run: python -m pytest -q

      - name: The version must agree with itself
        run: |
          python - <<'PY'
          import pathlib, re, tomllib
          a = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          b = re.search(r'__version__\s*=\s*"([^"]+)"',
                        pathlib.Path("rm_tables/__init__.py").read_text()).group(1)
          print("pyproject:", a, " __init__:", b)
          if a != b:
              raise SystemExit(f"::error::pyproject {a} does not match __init__ {b}")
          PY

      - name: Release tag must match pyproject.toml
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          PROJ=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "release tag: $TAG    pyproject: $PROJ"
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::tag $TAG does not match pyproject version $PROJ"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check the metadata and the README rendering
        run: twine check --strict dist/*

      - name: The wheel must carry the data files
        # A table cannot be built without them, and a missing one only shows up
        # for someone installing from the index.
        run: |
          python - <<'PY'
          import pathlib, zipfile
          whl = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(whl).namelist())
          # Read the list off the tree rather than writing it here. A written
          # list goes stale the first time a data file is renamed, and then
          # fails the release for a file that no longer exists.
          # Hidden files are never packaged, and a filesystem can leave one
          # behind when something deletes a file another process still holds.
          want = sorted(p.as_posix()
                        for p in pathlib.Path("rm_tables/data").iterdir()
                        if p.is_file() and not p.name.startswith("."))
          if not want:
              raise SystemExit("::error::rm_tables/data holds no files")
          missing = [w for w in want if w not in names]
          if missing:
              raise SystemExit(f"::error::{whl.name} is missing {missing}")
          print(f"{whl.name} carries all {len(want)} data files:")
          for w in want:
              print("   ", w)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'      # a manual run builds but does not upload
    environment:
      name: pypi
      url: https://pypi.org/p/rm-tables
    permissions:
      id-token: write          # mints the trusted-publisher token; nothing else needs it
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
